<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uh Oh Dice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Onboarding Modal -->
  <div id="onboarding-modal" class="onboarding-modal hidden">
    <div class="modal-content">
      <h2>Welcome to the Street</h2>
      <div id="player-list-setup"></div>
      <p>Add a player:</p>
      <input type="text" id="player-name-input" placeholder="Name..." maxlength="12">
      <button id="add-player-btn" style="margin-bottom: 10px;">Add Player</button>
      <button id="start-game-btn" disabled>Start Game</button>
    </div>
  </div>



  <!-- Top Status Bar -->
  <div class="status-bar" id="status-bar">
    <div class="status-info">
      <span>Shooter: <span id="status-player" style="color: #ff6600;">None</span></span>
      <span>|</span>
      <span>Pot: $<span id="status-pot-val">0</span></span>
      <span>|</span>
      <span>Point: <span id="point" style="color: #4caf50;">None</span></span>
    </div>
    <button class="reset-btn" id="reset-profile-btn">Reset Profile</button>
  </div>

  <div class="game-container">
    <div class="player-dashboard" id="player-dashboard"></div>

    <div class="messages" id="messages">
      Ready to roll? Hit the wall to count!
    </div>

    <!-- The game area serves as the "street" with the "wall" at the top -->
    <div class="play-area" id="play-area">
      <div class="wall" id="wall">WALL (Hit this!)</div>

      <!-- Overlays for Win / Loss -->
      <img src="https://media.giphy.com/media/hrQnFqUKTXwSSvH8AI/giphy.gif" alt="Winner Rain" class="overlay hidden" id="overlay-win">
      <img src="assets/loser.png" alt="Loser" class="overlay hidden" id="overlay-loss">
      <div id="overlay-text" class="overlay-text hidden"></div>


      <div class="dice-container" id="dice-container">
        <div class="scene">
          <div class="die" id="die1">
            <div class="face front"><span class="pip"></span></div>
            <div class="face back"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face right"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face left"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face top"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face bottom"><span class="pip"></span><span class="pip"></span></div>
          </div>
        </div>
        <div class="scene">
          <div class="die" id="die2">
            <div class="face front"><span class="pip"></span></div>
            <div class="face back"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face right"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face left"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face top"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face bottom"><span class="pip"></span><span class="pip"></span></div>
          </div>
        </div>
      </div>
    </div>


    <div class="controls" id="betting-controls">
      <div class="shooter-betting" id="shooter-betting">
        <label>Set Center Bet: $</label>
        <input type="number" id="center-bet-input" value="50" min="1" step="1">
        <button id="set-bet-btn">Set Bet</button>
        <button id="pass-dice-btn">Pass Dice</button>
      </div>
      <div class="fader-betting hidden" id="fader-betting">
        <label>Fade Amount: $</label>
        <input type="number" id="fade-input" value="50" min="1" step="1">
        <select id="fader-select"></select>
        <button id="add-fade-btn">Fade</button>
      </div>
      <div class="post-win-controls hidden" id="post-win-controls">
        <button id="let-it-ride-btn">Let it Ride</button>
        <button id="clear-bet-btn">Clear Bet</button>
      </div>
      <button id="throw-btn" class="throw-btn" disabled>THROW DICE</button>
    </div>

  </div>

  <script type="module">
    import { GameState } from './shared/logic.js';

    const game = new GameState();


    // UI Elements
    const pointEl = document.getElementById('point');
    const statusPlayerEl = document.getElementById('status-player');
    const statusPotValEl = document.getElementById('status-pot-val');
    const onboardingModal = document.getElementById('onboarding-modal');
    const playerListSetup = document.getElementById('player-list-setup');
    const playerNameInput = document.getElementById('player-name-input');
    const addPlayerBtn = document.getElementById('add-player-btn');
    const startGameBtn = document.getElementById('start-game-btn');
    const resetProfileBtn = document.getElementById('reset-profile-btn');

    const messagesEl = document.getElementById('messages');
    const throwBtn = document.getElementById('throw-btn');
    const diceContainer = document.getElementById('dice-container');
    const die1El = document.getElementById('die1');
    const die2El = document.getElementById('die2');
    const overlayWin = document.getElementById('overlay-win');
    const overlayLoss = document.getElementById('overlay-loss');
    const overlayText = document.getElementById('overlay-text');
    const playerDashboard = document.getElementById('player-dashboard');

    const shooterBetting = document.getElementById('shooter-betting');
    const centerBetInput = document.getElementById('center-bet-input');
    const setBetBtn = document.getElementById('set-bet-btn');

    const faderBetting = document.getElementById('fader-betting');
    const fadeInput = document.getElementById('fade-input');
    const faderSelect = document.getElementById('fader-select');
    const addFadeBtn = document.getElementById('add-fade-btn');

    const postWinControls = document.getElementById('post-win-controls');
    const letItRideBtn = document.getElementById('let-it-ride-btn');
    const clearBetBtn = document.getElementById('clear-bet-btn');

    let isThrowing = false;
    let tempPlayers = [];

    function renderDashboard() {
      playerDashboard.innerHTML = '';
      game.players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === game.shooterIndex ? 'is-shooter' : ''}`;

        let fadeAmount = game.fades[idx] || 0;
        let fadeText = fadeAmount > 0 ? ` (Fade: $${fadeAmount})` : '';

        card.textContent = `${p.name}: $${p.bankroll}${fadeText}`;
        playerDashboard.appendChild(card);
      });
    }

    function populateFaderSelect() {
      faderSelect.innerHTML = '';
      game.players.forEach((p, idx) => {
        if (idx !== game.shooterIndex && p.bankroll > 0) {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = p.name;
          faderSelect.appendChild(opt);
        }
      });
    }

    function updateUI(result) {
      renderDashboard();

      const shooter = game.getShooter();
      if(shooter) {
          statusPlayerEl.textContent = shooter.name;
      }

      const totalFaded = game.getTotalFaded();
      statusPotValEl.textContent = totalFaded + Math.min(game.centerBet, totalFaded);

      pointEl.textContent = game.point === null ? 'None' : game.point;

      if(result && result.message) {
          messagesEl.textContent = result.message;
      }

      overlayWin.classList.add('hidden');
      overlayLoss.classList.add('hidden');
      if(overlayText) overlayText.classList.add('hidden');

      if (result) {
          const actualBet = result.actualBet || 0;
          if (result.status === 'WIN') {
            messagesEl.className = 'messages win-text';
            overlayWin.classList.remove('hidden');
            if(overlayText) {
              overlayText.textContent = `+$${actualBet}`;
              overlayText.className = 'overlay-text win';
              overlayText.classList.remove('hidden');
            }
          } else if (result.status === 'LOSS') {
            messagesEl.className = 'messages loss-text';
            overlayLoss.classList.remove('hidden');
            if(overlayText) {
              overlayText.textContent = `-$${actualBet}`;
              overlayText.className = 'overlay-text loss';
              overlayText.classList.remove('hidden');
            }
          } else {
            messagesEl.className = 'messages';
          }
      }

      // Betting state management
      shooterBetting.classList.add('hidden');
      faderBetting.classList.add('hidden');
      postWinControls.classList.add('hidden');
      throwBtn.disabled = true;

      if (game.point !== null) {
        // Round in progress
        throwBtn.disabled = false;
        messagesEl.textContent = `Point is ${game.point}. Throw the dice!`;
      } else if (result && result.status === 'WIN') {
        postWinControls.classList.remove('hidden');
      } else {
        // Needs a bet
        if (game.centerBet === 0) {
          shooterBetting.classList.remove('hidden');
        } else {
          faderBetting.classList.remove('hidden');
          const remaining = game.centerBet - totalFaded;
          messagesEl.textContent = `$${remaining} left to fade.`;

          if (totalFaded >= game.centerBet) {
             throwBtn.disabled = false;
             messagesEl.textContent = "Bet fully faded! Throw the dice!";
             faderBetting.classList.add('hidden');
          } else if (totalFaded > 0) {
             throwBtn.disabled = false; // Allow partial fades
          }
        }
      }
    }

    function getRotation(value) {
      switch (value) {
        case 1: return { x: 0, y: 0 };
        case 2: return { x: 90, y: 0 };
        case 3: return { x: 0, y: -90 };
        case 4: return { x: 0, y: 90 };
        case 5: return { x: -90, y: 0 };
        case 6: return { x: 0, y: 180 };
        default: return { x: 0, y: 0 };
      }
    }

    function throwDice() {
      if (isThrowing) return;
      isThrowing = true;
      messagesEl.className = 'messages';
      messagesEl.textContent = 'Throwing...';

      overlayWin.classList.add('hidden');
      overlayLoss.classList.add('hidden');
      if(overlayText) overlayText.classList.add('hidden');

      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      const rot1 = getRotation(d1);
      const rot2 = getRotation(d2);

      diceContainer.style.transition = 'none';
      diceContainer.style.transform = 'translateY(0)';
      die1El.style.transition = 'none';
      die1El.style.transform = `rotateX(0deg) rotateY(0deg)`;
      die2El.style.transition = 'none';
      die2El.style.transform = `rotateX(0deg) rotateY(0deg)`;
      void diceContainer.offsetWidth;

      diceContainer.style.transition = 'transform 0.4s ease-out';
      diceContainer.style.transform = `translateY(-290px)`;

      die1El.style.transition = 'transform 0.4s linear';
      die2El.style.transition = 'transform 0.4s linear';
      const partialTumble1 = { x: rot1.x + 360, y: rot1.y + 360 };
      const partialTumble2 = { x: rot2.x + 360, y: rot2.y - 360 };
      die1El.style.transform = `rotateX(${partialTumble1.x}deg) rotateY(${partialTumble1.y}deg)`;
      die2El.style.transform = `rotateX(${partialTumble2.x}deg) rotateY(${partialTumble2.y}deg)`;

      setTimeout(() => {
        diceContainer.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
        diceContainer.style.transform = `translateY(-100px)`;

        die1El.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
        die2El.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
        const finalTumble1 = { x: rot1.x + 720, y: rot1.y + 720 };
        const finalTumble2 = { x: rot2.x + 720, y: rot2.y - 720 };
        die1El.style.transform = `rotateX(${finalTumble1.x}deg) rotateY(${finalTumble1.y}deg)`;
        die2El.style.transform = `rotateX(${finalTumble2.x}deg) rotateY(${finalTumble2.y}deg)`;

        setTimeout(() => {
          const result = game.handleRoll(d1, d2);
          updateUI(result);

          setTimeout(() => {
            diceContainer.style.transition = 'transform 0.5s ease-in';
            diceContainer.style.transform = 'translateY(0)';
            setTimeout(() => { isThrowing = false; }, 500);
          }, 1500);
        }, 600);
      }, 400);
    }

    // --- Onboarding & Profile Logic ---
    function checkProfile() {
      if (game.players.length < 2) {
        onboardingModal.classList.remove('hidden');
        renderTempPlayers();
      } else {
        onboardingModal.classList.add('hidden');
        populateFaderSelect();
      }
    }

    function renderTempPlayers() {
        playerListSetup.innerHTML = tempPlayers.map(p => `<div>${p}</div>`).join('');
        startGameBtn.disabled = tempPlayers.length < 2;
    }

    addPlayerBtn.addEventListener('click', () => {
      const name = playerNameInput.value.trim();
      if (name) {
          tempPlayers.push(name);
          playerNameInput.value = '';
          renderTempPlayers();
      }
    });

    startGameBtn.addEventListener('click', () => {
        tempPlayers.forEach(name => game.addPlayer(name, 500));
        tempPlayers = [];
        checkProfile();
        updateUI({ message: 'Game started. Shooter, set your bet!' });
    });

    resetProfileBtn.addEventListener('click', () => {
      if (confirm("Reset game completely?")) {
        game.resetProfile();
        tempPlayers = [];
        checkProfile();
      }
    });

    setBetBtn.addEventListener('click', () => {
        const bet = parseInt(centerBetInput.value, 10);
        if (bet > 0) {
            game.setCenterBet(bet);
            populateFaderSelect();
            updateUI();
        }
    });

    const passDiceBtn = document.getElementById('pass-dice-btn');
    passDiceBtn.addEventListener('click', () => {
        game.passDice();
        updateUI({ message: 'Dice passed to next player.' });
    });


    addFadeBtn.addEventListener('click', () => {
        const pIdx = parseInt(faderSelect.value, 10);
        const amt = parseInt(fadeInput.value, 10);
        if (amt > 0) {
            game.addFade(pIdx, amt);
            updateUI();
        }
    });

    letItRideBtn.addEventListener('click', () => {
        game.letItRide();
        updateUI();
    });

    clearBetBtn.addEventListener('click', () => {
        game.clearBet();
        updateUI();
    });

    checkProfile();
    if(game.players.length >= 2) {
       updateUI({ message: 'Welcome back. Shooter, set your bet!' });
    }

    throwBtn.addEventListener('click', throwDice);

  </script>

</body>
</html>
