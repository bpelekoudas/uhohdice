<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Dice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1>Street Dice</h1>
      <div class="stats">
        <div class="stat-box">
          <span class="label">Bankroll:</span>
          <span id="bankroll" class="value">$1000</span>
        </div>
        <div class="stat-box">
          <span class="label">Point:</span>
          <span id="point" class="value">None</span>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      Ready to roll? Hit the wall to count!
    </div>

    <!-- The game area serves as the "street" with the "wall" at the top -->
    <div class="play-area" id="play-area">
      <div class="wall" id="wall">WALL (Hit this!)</div>

      <!-- Overlays for Win / Loss -->
      <img src="https://media.giphy.com/media/hrQnFqUKTXwSSvH8AI/giphy.gif" alt="Winner Rain" class="overlay hidden" id="overlay-win">
      <img src="assets/loser.png" alt="Loser" class="overlay hidden" id="overlay-loss">

      <div class="dice-container" id="dice-container">
        <div class="scene">
          <div class="die" id="die1">
            <div class="face front"><span class="pip"></span></div>
            <div class="face back"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face right"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face left"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face top"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face bottom"><span class="pip"></span><span class="pip"></span></div>
          </div>
        </div>
        <div class="scene">
          <div class="die" id="die2">
            <div class="face front"><span class="pip"></span></div>
            <div class="face back"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face right"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face left"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face top"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
            <div class="face bottom"><span class="pip"></span><span class="pip"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="wager-container">
        <label for="wager-input" class="wager-label">Wager: $</label>
        <input type="number" id="wager-input" class="wager-input" value="10" min="1" step="1">
      </div>
      <button id="throw-btn" class="throw-btn">THROW DICE</button>
    </div>
  </div>

  <script type="module">
    import { GameState } from './shared/logic.js';

    const game = new GameState();

    // UI Elements
    const bankrollEl = document.getElementById('bankroll');
    const pointEl = document.getElementById('point');
    const messagesEl = document.getElementById('messages');
    const throwBtn = document.getElementById('throw-btn');
    const diceContainer = document.getElementById('dice-container');
    const die1El = document.getElementById('die1');
    const die2El = document.getElementById('die2');
    const playArea = document.getElementById('play-area');
    const wall = document.getElementById('wall');
    const wagerInput = document.getElementById('wager-input');
    const overlayWin = document.getElementById('overlay-win');
    const overlayLoss = document.getElementById('overlay-loss');

    let isThrowing = false;

    function updateUI(result) {
      bankrollEl.textContent = `$${result.bankroll}`;
      pointEl.textContent = result.point === null ? 'None' : result.point;
      messagesEl.textContent = result.message;

      // Hide overlays by default
      overlayWin.classList.add('hidden');
      overlayLoss.classList.add('hidden');

      // Add a class for visual feedback based on win/loss and show overlays
      if (result.status === 'WIN') {
        messagesEl.className = 'messages win';
        overlayWin.classList.remove('hidden');
      } else if (result.status === 'LOSS') {
        messagesEl.className = 'messages loss';
        overlayLoss.classList.remove('hidden');
      } else {
        messagesEl.className = 'messages';
      }

      // Handle wager input state
      if (result.point !== null) {
        // Point is set, disable wager changing during the round
        wagerInput.disabled = true;
      } else {
        // Round is over (or hasn't started), allow wagering
        wagerInput.disabled = false;

        // Optional: Ensure wager doesn't exceed new bankroll
        if (parseInt(wagerInput.value) > result.bankroll) {
           wagerInput.value = result.bankroll;
        }
      }
    }

    function getRotation(value) {
      switch (value) {
        case 1: return { x: 0, y: 0 };
        case 2: return { x: 90, y: 0 };  // bottom face
        case 3: return { x: 0, y: -90 }; // right face
        case 4: return { x: 0, y: 90 };  // left face
        case 5: return { x: -90, y: 0 }; // top face
        case 6: return { x: 0, y: 180 }; // back face
        default: return { x: 0, y: 0 };
      }
    }

    function throwDice() {
      if (isThrowing) return;
      isThrowing = true;
      messagesEl.className = 'messages';
      messagesEl.textContent = 'Throwing...';

      // Hide overlays as soon as a new throw starts
      overlayWin.classList.add('hidden');
      overlayLoss.classList.add('hidden');

      // Decide result early so we can compute target rotation
      const isShortRoll = Math.random() < 0.1;
      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;

      const rot1 = getRotation(d1);
      const rot2 = getRotation(d2);

      // Reset container and dice position/rotation
      diceContainer.style.transition = 'none';
      diceContainer.style.transform = 'translateY(0)';

      die1El.style.transition = 'none';
      die1El.style.transform = `rotateX(0deg) rotateY(0deg)`;
      die2El.style.transition = 'none';
      die2El.style.transform = `rotateX(0deg) rotateY(0deg)`;

      // Force reflow
      void diceContainer.offsetWidth;

      // 1. Initial throw to the wall
      // The dice container moves up quickly, mimicking a strong throw
      diceContainer.style.transition = 'transform 0.4s ease-out';

      const throwDistance = isShortRoll ? -150 : -290; // -290 hits the wall, -150 falls short
      diceContainer.style.transform = `translateY(${throwDistance}px)`;

      // Both dice spin fast initially
      die1El.style.transition = 'transform 0.4s linear';
      die2El.style.transition = 'transform 0.4s linear';

      // Partial tumble during the throw to the wall
      const partialTumble1 = { x: rot1.x + 360, y: rot1.y + 360 };
      const partialTumble2 = { x: rot2.x + 360, y: rot2.y - 360 };

      die1El.style.transform = `rotateX(${partialTumble1.x}deg) rotateY(${partialTumble1.y}deg)`;
      die2El.style.transform = `rotateX(${partialTumble2.x}deg) rotateY(${partialTumble2.y}deg)`;

      // When the dice reach the wall (after 400ms)
      setTimeout(() => {
        if (isShortRoll) {
          // Short rolls just stop, no bounce off wall
          messagesEl.textContent = 'Short Roll! Dice must hit the wall. Try again.';
          messagesEl.className = 'messages short-roll';

          // Reset dice container position after a delay
          setTimeout(() => {
            diceContainer.style.transition = 'transform 0.5s ease-in';
            diceContainer.style.transform = 'translateY(0)';
            setTimeout(() => { isThrowing = false; }, 500);
          }, 1500);

        } else {
          // 2. Bounce off the wall
          // Slower bounce back down into the play area
          diceContainer.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
          diceContainer.style.transform = `translateY(-100px)`; // Bounce back to mid-screen

          // Slow down the tumbling to the final face
          die1El.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
          die2El.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';

          // Final target rotations including an extra 360 spin during the bounce
          const finalTumble1 = { x: rot1.x + 720, y: rot1.y + 720 };
          const finalTumble2 = { x: rot2.x + 720, y: rot2.y - 720 };

          die1El.style.transform = `rotateX(${finalTumble1.x}deg) rotateY(${finalTumble1.y}deg)`;
          die2El.style.transform = `rotateX(${finalTumble2.x}deg) rotateY(${finalTumble2.y}deg)`;

          // Wait for bounce to finish (600ms) before evaluating result
          setTimeout(() => {
            // Read the wager amount from the input field
            let wagerAmount = parseInt(wagerInput.value, 10);
            if (isNaN(wagerAmount) || wagerAmount < 1) wagerAmount = 1;

            // Prevent betting more than available bankroll
            if (wagerAmount > game.bankroll && game.point === null) {
              wagerAmount = game.bankroll;
              wagerInput.value = wagerAmount;
            }

            const result = game.handleRoll(d1, d2, wagerAmount);
            updateUI(result);

            // Reset dice container position after a delay
            setTimeout(() => {
              diceContainer.style.transition = 'transform 0.5s ease-in';
              diceContainer.style.transform = 'translateY(0)';
              setTimeout(() => { isThrowing = false; }, 500);
            }, 1500);

          }, 600); // Wait for bounce animation
        }
      }, 400); // Wait for initial throw to hit wall
    }

    // Initialize UI on load so wager field acts correctly initially
    updateUI({
      bankroll: game.bankroll,
      point: game.point,
      message: 'Set your wager and hit the wall!',
      status: 'CONTINUE'
    });

    throwBtn.addEventListener('click', throwDice);

  </script>
</body>
</html>
